[pytest]
# Only the suite, and only the root: `testpaths = .` walked design/ and its
# node_modules trees, which is slow and finds nothing.
testpaths = test_claude_risk_classifier.py
addopts = -v -m "not private_layout"
# helper/pytest.ini is this file for the public repo; a test holds the two
# equal but for testpaths and the public one's -m that deselects these.
markers =
    private_layout: needs files only the product repo has (WatchApp/, sync-helper.sh, the release and CI tooling); deselected in the public helper repo
