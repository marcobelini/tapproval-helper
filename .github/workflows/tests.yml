# The hook runs under whatever python3 is on the user's PATH — which is why
# this matrix exists rather than a single "latest" job. macOS still ships
# 3.9, and a syntax feature from 3.10 would break the tool silently on the
# machines it is meant to protect.
name: tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:

# Read-only by default: nothing here writes to the repository, so a step
# that is ever compromised gets a token that can only read. Pinned actions
# (full commit SHAs, version in the comment) are the same idea — a moved
# tag cannot change what runs.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    # A hang ends with its log kept; a cancelled job keeps none.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every host the helper promises (2026-10-28): free on a public repo.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Refuse third-party dependencies
        run: |
          # Standard library only is a hard constraint: hooks run under an
          # interpreter we do not control. This half catches the packaging
          # files; what the code actually imports is walked by
          # TestStandardLibraryOnly in the suite below, because "no
          # requirements.txt" is not what the rule says.
          test ! -f requirements.txt
          test ! -f pyproject.toml
      - run: pip install pytest==8.4.2  # the newest that still runs on 3.9
      # A test still running after two minutes prints every thread's stack.
      - run: pytest -q -o faulthandler_timeout=120
      # Install, a wrist allow and deny through the real hook, uninstall:
      # the round trip a user's computer makes, on this runner's host.
      - run: python e2e_host_roundtrip.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Match the local validator; Ubuntu's 0.9 reports older trap/test false positives.
      - name: Install verified ShellCheck 0.11.0
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 \
            "$RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version
      # Every tracked script and the whole tree, the same lines as the
      # private workflow's: a list of names is a guard that has to be
      # remembered, and test_the_two_ci_workflows_share_their_test_steps
      # now holds this job equal to the private one.
      - run: git ls-files -z '*.sh' ':!:design/**' | xargs -0 shellcheck
      - run: pipx run ruff==0.16.9 check --select E,F,W,B --ignore E501 --line-length 100 --exclude design .
