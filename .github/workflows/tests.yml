# The hook runs under whatever python3 is on the user's PATH — which is why
# this matrix exists rather than a single "latest" job. macOS still ships
# 3.9, and a syntax feature from 3.10 would break the tool silently on the
# machines it is meant to protect.
name: tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:

# Read-only by default: nothing here writes to the repository, so a step
# that is ever compromised gets a token that can only read. Pinned actions
# (full commit SHAs, version in the comment) are the same idea — a moved
# tag cannot change what runs.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Refuse third-party dependencies
        run: |
          # Standard library only is a hard constraint: hooks run under an
          # interpreter we do not control. This half catches the packaging
          # files; what the code actually imports is walked by
          # TestStandardLibraryOnly in the suite below, because "no
          # requirements.txt" is not what the rule says.
          test ! -f requirements.txt
          test ! -f pyproject.toml
      - run: pip install pytest==8.4.2  # the newest that still runs on 3.9
      - run: pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh uninstall.sh
